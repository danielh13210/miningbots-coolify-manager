<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instance Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <link href="/static/styles.css" rel="stylesheet" />
  <script src="/static/management.js"></script>
</head>

<body>
  <div id="navbar-peek-triggerbox"></div>
  <nav class="navbar navbar-expand-lg navbar-light bg-light competition-disabled">
    <img src="/static/favicon.ico" alt="tinkercademy logo" class="navbar-brand-logo">
    <a class="navbar-brand navbar-collapse" href="/">Instance Manager</a>
    <div id="navbarLogoutDropdown">
      <ul class="navbar-nav">
        <li class="nav-item dropdown">
          <a class="collapse-if-minified nav-link dropdown-toggle" href="#" id="navbarLogoutDropdownMenuLink" role="button"
            data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <img src="/static/user.svg" class="icon" alt="User menu" title="User menu">
          </a>
          <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdownMenuLink">
            <span class="dropdown-item-text">{{username}}</span>
            <a class="dropdown-item" href="/change_password" id="change-password-button">
              Change password
            </a>
            <a class="dropdown-item" href="/logout" id="logout-button">
              Log Out
              <img src="/static/logout.svg" class="icon" alt="Logout" title="Logout">
            </a>
          </div>
        </li>
      </ul>
    </div>
  </nav>
  <h1>Sharing Settings for instance {{instance}}</h1>
  <div class="instances-row">
    <h1>Users with access</h1>
    <span>
      <button class="btn" onclick="location.href='/sharing/share?instance={{instance}}';"><img src="/static/add.svg" alt="Add User"></button>
    </span>
  </div>
  {% if share_destinations %}
    {% for share_destination in share_destinations %}
      <div class="instance-box" id="instancebox-{{instance}}">
        <span>User: {{share_destination}}</span>
        <br>
        <button class="btn btn-danger" onclick="delete_share_clicked('{{share_destination}}','{{instance}}')" id="delete-share-{{share_destination}}">Remove</button>
      </div>
    {% endfor %}
  {% else %}
    <h2 id="no-instance">No one else has access.</h2>
  {% endif %}
  <br>
</body>
