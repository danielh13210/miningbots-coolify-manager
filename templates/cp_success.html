<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Changed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <link href="/static/styles.css" rel="stylesheet" />
</head>

<body>
  <div id="navbar-peek-triggerbox"></div>
  <nav class="navbar navbar-expand-lg navbar-light bg-light competition-disabled">
    <img src="/static/favicon.ico" alt="tinkercademy logo" class="navbar-brand-logo">
    <a class="navbar-brand navbar-collapse" href="/">Instance Manager</a>
    <div id="navbarLogoutDropdown">
      <ul class="navbar-nav">
        <li class="nav-item dropdown">
          <a class="collapse-if-minified nav-link dropdown-toggle" href="#" id="navbarLogoutDropdownMenuLink" role="button"
            data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <img src="/static/user.svg" class="icon" alt="User menu" title="User menu">
          </a>
          <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdownMenuLink">
            <span class="dropdown-item-text">{{username}}</span>
            <a class="dropdown-item" href="/change_password" id="change-password-button">
              Change password
            </a>
            <a class="dropdown-item" href="/logout" id="logout-button">
              Log Out
              <img src="/static/logout.svg" class="icon" alt="Logout" title="Logout">
            </a>
          </div>
        </li>
      </ul>
    </div>
  </nav>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h1 class="card-title mb-4">Password Changed</h1>
            <p class="lead">Your password has been updated successfully.</p>
            <a class="btn btn-primary mt-3" href="/">Return to dashboard</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
